[package]
name = "mc-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.5.37", features = ["derive"] }
cli-table = "0.5.0"
compress-tools = "0.16.1"
directories = "6.0.0"
futures-util = "0.3.31"
indicatif = "0.17.11"
jars = "0.1.1"
open = "5.3.2"
regex = "1.11.1"
reqwest = { version = "0.12.15", features = ["blocking", "stream"] }
serde = { version = "*", features = ["derive"] }
serde-xml-rs = "0.8.0"
serde_json = "1.0.140"
serde_path_to_error = "0.1.17"
sys-info = "0.9.1"
tokio = { version = "1.45.0", features = ["full"] }
urlencoding = "2.1.3"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
zip = "8.6.0"
